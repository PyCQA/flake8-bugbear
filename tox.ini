# The test environment and commands
[tox]
# default environments to run without `-e`
envlist = py311, py312, py313, py314, py315, pep8_naming, mypy

[gh-actions]
python =
    3.11: py311,pep8_naming, py311-mypy
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315, mypy

[testenv]
description = Run coverage
deps =
    coverage
    hypothesis
    hypothesmith
    pytest
commands =
    coverage run -m pytest tests/test_bugbear.py {posargs}
    coverage report -m

[testenv:pep8_naming]
deps =
    coverage
    hypothesis
    hypothesmith
    pytest
    pep8-naming
commands =
    coverage run -m pytest tests/test_bugbear.py -k b902 {posargs}
    coverage report -m

[testenv:{,py311-,py312-,py313-,py314-,py315-}mypy]
deps =
    mypy
    types-flake8
commands =
    mypy --strict bugbear.py
